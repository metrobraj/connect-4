<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>connect 4</title>
<style>
:root {
  --bg: #12141a;
  --ink: #2d3142;          /* Darker slate text for readability on light glass */
  --mute: #6c757d;         /* Soft grey subtext */
  --board: #7b83a7;        /* Soft pastel indigo board */
  --hole: #f0f3fa;         /* Light pastel empty slot */
  --you: #f4b03d;
  --ai: #e4533f;
  --line: #d0d5dd;
}
body {
  margin: 0;
  min-height: 100vh;
  background: url('blue.gif') no-repeat center center fixed;
  background-size: cover;
  color: var(--ink);
  font: 16px/1.5 "Avenir Next","Segoe UI",system-ui,sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px 14px 40px;
}
main {
  width: 100%;
  max-width: 460px;
  padding: 24px;
  border-radius: 28px;

  /* Frosted glass base + Liquid SVG filter */
  background: 
    linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.05)),
    rgba(255, 255, 255, 0.1);
  backdrop-filter: blur(16px) saturate(200%) url(#liquid-refraction);
  -webkit-backdrop-filter: blur(16px) saturate(200%) url(#liquid-refraction);

  /* 1. Crisp outer edge that simulates a light source from top-left */
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-bottom-color: rgba(255, 255, 255, 0.15);
  border-right-color: rgba(255, 255, 255, 0.15);

  /* 2. Inner reflections and outer ambient shadow */
  box-shadow: 
    0 30px 60px rgba(0, 0, 0, 0.12),               /* Deep outer shadow for depth */
    inset 0 2px 3px rgba(255, 255, 255, 0.9),      /* Strong top inner shine */
    inset 0 -1px 2px rgba(255, 255, 255, 0.3),     /* Subtle bottom inner bounce light */
    inset 1px 0 2px rgba(255, 255, 255, 0.6);      /* Left edge inner shine */
}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--mute);margin:0 0 16px;font-size:.92rem}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
select,button{font:inherit;background:#1c1f28;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button.primary{background:var(--you);color:#1a1405;border-color:var(--you);font-weight:600}
button:focus-visible,select:focus-visible{outline:2px solid var(--you);outline-offset:2px}
label.chk{display:flex;align-items:center;gap:6px;color:var(--mute);font-size:.9rem}
#status{min-height:1.6em;font-weight:600;margin-bottom:10px}
#grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--board);padding:10px;border-radius:14px}
.col{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;background:none;border:0;padding:0;cursor:pointer;border-radius:8px}
.col:disabled{cursor:default}
.col:not(:disabled):hover,.col:focus-visible{background:rgba(255,255,255,.1);outline:none}
.cell{aspect-ratio:1;border-radius:50%;background:var(--hole);box-shadow:inset 0 3px 6px rgba(0,0,0,.5)}
.cell.p1{background:var(--you)}.cell.p2{background:var(--ai)}
.cell.new{animation:fall .3s ease-in}
.cell.win{box-shadow:0 0 0 3px #fff,0 0 14px #fff}
@keyframes fall{from{transform:translateY(-260%)}}
@media(prefers-reduced-motion:reduce){.cell.new{animation:none}}
#stats{margin-top:18px;border-top:1px solid var(--line);padding-top:12px;color:var(--mute);font-size:.88rem}
#stats h2{font-size:.95rem;color:var(--ink);margin:0 0 6px}
#stats dl{display:grid;grid-template-columns:auto 1fr;gap:2px 14px;margin:0}
#stats dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums}
.key{display:inline-block;width:.8em;height:.8em;border-radius:50%;vertical-align:baseline;margin-right:4px}
</style></head><body>

<!-- Hidden SVG Filter for Refraction/Distortion -->
<svg xmlns="http://w3.org/2000/svg" style="display: none;">
  <filter id="liquid-refraction">
    <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise" />
    <feGaussianBlur in="noise" stdDeviation="5" result="blurredNoise" />
    <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="30" xChannelSelector="R" yChannelSelector="G" />
  </filter>
</svg>

<main>
<h1>connect 4</h1>
<p class="sub">you're playing as <span class="key" style="background:var(--you)"></span>  your AI opponent is <span class="key" style="background:var(--ai)"></span>  and will beat you everytime :p</p>
<div class="bar">
  <label class="chk"><input type="checkbox" id="aifirst">Want AI to start first?</label>
  <button class="primary" id="new">New game</button>
</div>
<div id="status" role="status" aria-live="polite"></div>
<div id="grid"></div>
<details id="stats" hidden>
  <summary style="cursor: pointer; font-weight: bold; color: var(--ink); margin-bottom: 8px;">secret dev tools</summary>
  <dl id="sd"></dl>
</details>
</main>
<script>
let id=null,state=null,busy=false,prev=null;
const $=s=>document.querySelector(s),grid=$('#grid');
const API=new URLSearchParams(location.search).get('api')||'';
async function api(path,body){
  let r,t;
  try{r=await fetch(API+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});t=await r.text();}
  catch(e){throw new Error('Cannot reach the Python server. Run "python app.py" and open http://127.0.0.1:5000');}
  let j;try{j=JSON.parse(t);}catch(e){throw new Error('Got a web page instead of game data (HTTP '+r.status+'). Open the game through the Flask server at http://127.0.0.1:5000, not as a file or static preview.');}
  if(!r.ok)throw new Error(j.error||'Request failed');return j;
}
function render(){
  const win=new Set((state.win_cells||[]).map(([r,c])=>r+','+c));
  const over=state.status!=='playing';
  grid.innerHTML='';
  for(let c=0;c<7;c++){
    const b=document.createElement('button');b.className='col';b.setAttribute('aria-label','Drop in column '+(c+1));
    b.disabled=busy||over||state.board[0][c]!==0;b.onclick=()=>play(c);
    for(let r=0;r<6;r++){
      const v=state.board[r][c],d=document.createElement('div');
      d.className='cell'+(v?' p'+v:'')+(win.has(r+','+c)?' win':'');
      if(v&&(!prev||prev[r][c]!==v))d.classList.add('new');
      b.appendChild(d);
    }
    grid.appendChild(b);
  }
  prev=state.board.map(r=>[...r]);
  $('#status').textContent=busy?'lemme think…':state.status==='win'?(state.winner===1?'You win!':'The AI wins.'):state.status==='draw'?'Draw: the board is full.':'Your turn: pick a column.';
  const a=state.ai;$('#stats').hidden=!a;
  if(a)$('#sd').innerHTML=`<dt>Chose</dt><dd>column ${a.column+1}</dd><dt>Search depth</dt><dd>${a.depth} moves ahead</dd><dt>Positions searched</dt><dd>${a.nodes.toLocaleString()}</dd><dt>Branches pruned</dt><dd>${a.pruned.toLocaleString()}</dd><dt>Time</dt><dd>${a.ms} ms</dd><dt>Position score</dt><dd>${Math.abs(a.score)>=1e5?(a.score>0?'forced win':'forced loss'):a.score}</dd>`;
}
async function start(){
  busy=true;prev=null;
  try{const j=await api('/api/new',{ai_first:$('#aifirst').checked});id=j.id;state=j;}
  catch(e){$('#status').textContent=e.message;}
  busy=false;if(state)render();
}
async function play(col){
  if(busy)return;
  // show the human move immediately, then wait for the AI reply
  busy=true;
  const r=[...Array(6).keys()].reverse().find(r=>state.board[r][col]===0);
  state.board[r][col]=1;render();
  try{state=await api('/api/move',{id,col});}catch(e){$('#status').textContent=e.message;}
  busy=false;render();
}
$('#new').onclick=start;start();
</script></body></html>
